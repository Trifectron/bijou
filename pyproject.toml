# The workspace. Every app under apps/ is its own package with its own pyproject.toml. This file
# holds the tooling they share and the dependency rule, between apps and inside each one.
#
#   apps/engine   the diffusion model and its skill bank, the agent that equips it, collection,
#                 research, and the engine command
#   apps/evals    golden cases against a serving engine, scored by suite, gated on a baseline
#   apps/cli      the developer console over every just recipe
#
# Apps never import each other. evals reaches the engine over HTTP; the console runs recipes.

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv]
conflicts = [[{ package = "engine", extra = "cpu" }, { package = "engine", extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored upstream. Never reformatted or linted here; update by re-pulling the submodule.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "T20", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "evals", "cli"]

[tool.ruff.lint.per-file-ignores]
"apps/engine/commands/*" = ["T20"]
"apps/evals/cli.py" = ["T20"]
"apps/*/tests/*" = ["ANN", "ARG"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "apps/engine/core",
    "apps/engine/routing",
    "apps/engine/skills",
    "apps/engine/agent",
    "apps/engine/clients/chat.py",
    "apps/engine/clients/remote_bank.py",
    "apps/engine/tools",
    "apps/engine/memory",
    "apps/engine/telemetry",
    "apps/evals",
]
exclude = ["apps/[^/]+/tests/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps"]
# Test files share basenames across apps, so each is imported by path rather than by name.
addopts = "--strict-markers --import-mode=importlib"
# The vendored model is on sys.path for tests that import it directly. Production code reaches
# it through engine.backends, whose __init__ does the same.
pythonpath = ["third_party/nanoDiff"]
markers = ["gpu: needs a GPU and a base checkpoint"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# The dependency rule. Adding an edge means editing this section and docs/ARCHITECTURE.md in the
# same change. Enforced by scripts/check-deps.sh, which runs in just check, the pre-commit hook,
# and CI.
[tool.importlinter]
root_packages = ["engine", "evals", "cli"]
# Required so the vendored-model and torch contracts can see external imports.
include_external_packages = true
# The contracts are about what runs. An import under TYPE_CHECKING never does.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "apps never import each other"
type = "independence"
modules = ["engine", "evals", "cli"]

# ---------------------------------------------------------------- inside the engine
#
#   commands
#   api
#   wiring
#   agent | clients | tools | memory | collect
#   runtime
#   telemetry
#   {adapters, routing, skills} and backends
#   core

[[tool.importlinter.contracts]]
name = "engine layering"
type = "layers"
layers = [
    "engine.commands",
    "engine.api",
    "engine.wiring",
    "engine.agent | engine.clients | engine.tools | engine.memory | engine.collect",
    "engine.runtime",
    "engine.telemetry",
    "engine.backends",
    "engine.core",
]

[[tool.importlinter.contracts]]
name = "adapters, routing and skills are siblings and never import each other"
type = "independence"
modules = ["engine.adapters", "engine.routing", "engine.skills"]

[[tool.importlinter.contracts]]
name = "core imports nothing else in the engine"
type = "forbidden"
source_modules = ["engine.core"]
forbidden_modules = [
    "engine.telemetry",
    "engine.adapters",
    "engine.routing",
    "engine.skills",
    "engine.backends",
    "engine.runtime",
    "engine.agent",
    "engine.clients",
    "engine.tools",
    "engine.memory",
    "engine.collect",
    "engine.wiring",
    "engine.api",
    "engine.commands",
]

[[tool.importlinter.contracts]]
name = "only backends may import the vendored model"
type = "forbidden"
# Direct imports only. runtime reaches nanoDiff through the backend, which is the point.
allow_indirect_imports = true
source_modules = [
    "engine.core",
    "engine.adapters",
    "engine.routing",
    "engine.skills",
    "engine.runtime",
    "engine.agent",
    "engine.clients",
    "engine.tools",
    "engine.memory",
    "engine.collect",
    "engine.wiring",
    "engine.api",
    "engine.commands",
]
forbidden_modules = ["nanodiff"]

[[tool.importlinter.contracts]]
name = "skills are data and graders, with no model stack and no network"
type = "forbidden"
source_modules = ["engine.skills"]
forbidden_modules = ["torch", "httpx", "engine.backends", "engine.runtime"]

[[tool.importlinter.contracts]]
name = "the agent loop never loads the diffusion model; it reaches it through SkillRuntime"
type = "forbidden"
source_modules = ["engine.agent", "engine.tools", "engine.memory"]
forbidden_modules = ["torch", "engine.runtime", "engine.backends", "engine.adapters"]

[[tool.importlinter.contracts]]
name = "only clients, tools and collect open network connections"
type = "forbidden"
source_modules = [
    "engine.core",
    "engine.agent",
    "engine.memory",
    "engine.runtime",
    "engine.adapters",
    "engine.routing",
    "engine.skills",
    "engine.backends",
]
forbidden_modules = ["httpx", "mcp"]
allow_indirect_imports = true
