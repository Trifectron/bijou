# Every service sits behind a profile; docker compose up with no profile starts nothing.
#   model    chat: llama-server with the chat model on :8000.
#   observe  phoenix (traces, :6006), prometheus (:9090), grafana (:3000).
#   gpu      gpu-exporter: GPU utilisation and VRAM from nvidia-smi on :9835.
# Every port binds to 127.0.0.1.
# Example: docker compose -f deploy/compose.yml --profile model --profile observe up -d
# The project is named bijou, so its containers and volumes are bijou_* on any machine.

name: bijou

services:
  # The chat model. GGUFs download on first run into the modelcache volume.
  chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [model]
    command:
      - -hf
      - ${BIJOU_CHAT_GGUF:-Qwen/Qwen3-4B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # ctx-size is the total across slots: each of --parallel N gets ctx-size / N.
      - --ctx-size
      - ${BIJOU_CHAT_CTX:-8192}
      - --parallel
      - ${BIJOU_CHAT_PARALLEL:-2}
      - --n-gpu-layers
      - ${BIJOU_CHAT_NGL:-99}
      - --jinja
      - --metrics
    volumes: [modelcache:/root/.cache/llama.cpp]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    restart: unless-stopped

  # Trace UI (Arize Phoenix). UI and OTLP HTTP on 6006, OTLP gRPC on 4317.
  phoenix:
    image: arizephoenix/phoenix:version-20.11.0
    profiles: [observe]
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes: [phoenixdata:/data]
    ports: ["127.0.0.1:6006:6006", "127.0.0.1:4317:4317"]
    # The image has no shell, so the check runs its own interpreter. A phoenix that cannot
    # migrate its database restarts in a loop; without this it looks up between crashes.
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:6006/")
      interval: 15s
      timeout: 5s
      start_period: 40s
    restart: unless-stopped

  # Metrics store. Scrapes llama-server, engine chat on the host, and the GPU exporter.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observe]
    # On the host network, so it scrapes services bound to the host's loopback.
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

  # Dashboards over Prometheus: http://localhost:3000, admin/admin. Dashboards are provisioned.
  grafana:
    image: grafana/grafana:11.5.1
    profiles: [observe]
    # On the host network beside prometheus, listening on the loopback only.
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${BIJOU_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    depends_on: [prometheus]
    restart: unless-stopped

  # GPU utilisation and VRAM, read from nvidia-smi.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    profiles: [gpu]
    # The nvidia container runtime injects nvidia-smi through the utility capability.
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports: ["127.0.0.1:9835:9835"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu, utility] }
    restart: unless-stopped

volumes:
  modelcache:
  phoenixdata:
  promdata:
  grafanadata:
