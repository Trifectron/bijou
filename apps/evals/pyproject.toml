[project]
name = "evals"
version = "0.1.0"
description = "Golden cases run through the engine command, scored by suite and gated on a committed baseline"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13",
]

[project.scripts]
evals = "evals.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "evals" = "." }
packages = ["evals", "evals.core", "evals.suites"]
package-data = { "evals" = ["cases/*.jsonl", "baseline.json"] }
