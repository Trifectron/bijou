# Every tunable value lives here at its default. .env holds only secrets and
# per-machine URLs. Override any key with BIJOU_<SECTION>__<KEY>.
#
# Shared by every app in apps/. Each reads only the tables it owns: the engine the unprefixed
# model tables, [bank], [collect] and [agent.*]; evals [evals]; and the
# console [console] plus the few paths its status bar reports.

[paths]
base_checkpoints = "checkpoints/base"
adapters = "checkpoints/adapters"
data = "data"
runs = "runs"

[backend]
name = "nanodiff"
# A file in paths.base_checkpoints, fetched by just checkpoints. Empty means random weights.
checkpoint = "nanodiff-150m-sft-alpaca"
device = "cuda"
dtype = "bfloat16"
compile = false

[adapter]
rank = 16
alpha = 16.0
dropout = 0.0
targets = ["attn.qkv", "attn.proj", "mlp.w1", "mlp.w2", "mlp.w3"]

[train]
lr = 1e-3
full_finetune_lr = 5e-5
batch_size = 8
max_steps = 2000
warmup_steps = 100
weight_decay = 0.0
grad_clip = 1.0
prompt_len = 256
response_len = 256
train_samples = 20000
seed = 0

[sampling]
steps = 64
gen_length = 128
block_length = 64
temperature = 0.0

[eval]
eval_samples = 500
seed = 1
skills = ["json_extract"]
# Rows of the matrix: every adapter subset, the tuned-prompt baseline, each full fine-tune.
conditions = ["adapters", "tuned-prompt", "full-finetune"]

[prompting]
# Candidates are every skill instruction crossed with every shot count, scored on a dev split.
shots = [0, 3]
dev_samples = 100
seed = 2

[console]
# The developer console, just console. Every line a unit prints is also appended to log_dir.
log_lines = 5000
log_dir = ".bijou/logs"
status_interval_secs = 5.0
metrics_interval_secs = 2.0

# ---------------------------------------------------------------- the skill bank
# Loaded in the agent's process. A request for more positions than this is refused.
[bank]
max_gen_length = 512

# ---------------------------------------------------------------- LoRA collection
# A teacher LLM writes the examples a dataset skill trains on. base_url and api_key are
# per-machine and live in .env.
[collect]
model = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
thinking = false
temperature = 0.8
max_tokens = 4096
timeout_secs = 180.0
examples = 300
per_request = 10
max_rounds = 100
dev_ratio = 0.1
eval_ratio = 0.2
seed = 3

# ================================================================ the agent
# The agent in apps/engine: an LLM plans and picks diffusion skills, subagents act with tools and MCP.
# Secrets and per-machine URLs live in .env: BIJOU_AGENT__LLM__BASE_URL and ..._API_KEY.
# Every prompt the agent writes is in [agent.prompt]
# with a default in apps/engine/core/config/agent.py; set a key here to change the wording.

# The chat model that plans, selects skills and drives each subagent. llama-server by default.
[agent.llm]
model = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
thinking = false
max_tokens = 1024
temperature = 0.2
timeout_secs = 120.0

# The skill bank, loaded in the agent's process. Unset gen_length and steps use [sampling].
[agent.skills]
timeout_secs = 300.0

[agent.loop]
max_turns = 8
max_model_retries = 2
retry_base_ms = 250
retry_cap_ms = 8000
run_timeout_secs = 600.0
tool_timeout_secs = 60.0
max_tool_output_chars = 6000
# Characters of each prompt and reply kept on its trace event and span; 0 keeps none.
record_content_chars = 32000

# max_steps is how many subagents one request may use; concurrency how many run at once.
[agent.planning]
max_steps = 4
concurrency = 2
max_skills = 2
allow_schedules = true

# Risk classes in order: read_public, read_authenticated, prepare_write, external_write,
# destructive, forbidden. Classes at or above confirm_from wait for the user.
[agent.policy]
confirm_from = "external_write"
allow_authenticated_reads = false
confirmation_ttl_secs = 900

[agent.tools]
disabled = []
current_time = true
recall_sessions = true
fetch_url = true
fetch_max_chars = 8000
fetch_timeout_secs = 20.0
fetch_allowed_domains = []
user_agent = "bijou-engine/0.1"

[agent.mcp]
max_description_chars = 200

# [[agent.mcp.servers]]
# name = "computer"
# command = "npx"
# args = ["-y", "some-computer-use-mcp"]
# tools = []
# timeout_secs = 60.0
# risk = "external_write"

[agent.sessions]
path = ".bijou/sessions.db"
resume_chars = 2000
list_limit = 20

# A kind of work seen in min_occurrences sessions with no skill equipped becomes a proposal.
[agent.patterns]
min_occurrences = 3
similarity = 0.5
window = 500
proposals_dir = "data/proposals"
max_examples = 20

# enabled writes one JSONL file per session; live prints each event as engine run and engine chat
# work, so the plan, the skills each step equipped and every tool call are visible before the answer.
[agent.trace]
enabled = true
dir = ".bijou/traces"
live = true

# ================================================================ telemetry
# Spans over OTLP to Phoenix. otlp_endpoint is per-machine and lives in .env as
# BIJOU_TELEMETRY__OTLP_ENDPOINT, for example http://127.0.0.1:6006/v1/traces; empty sends none.
# engine chat serves Prometheus metrics at metrics_host:metrics_port/metrics while it runs, for
# just up observe to scrape; port 0 serves none.
[telemetry]
service_name = "bijou-engine"
# The Phoenix project the spans land in; its own project keeps them apart from anything else
# sending to the same collector.
project_name = "bijou"
sample_ratio = 1.0
export_timeout_secs = 10.0
metrics_host = "127.0.0.1"
metrics_port = 9464

# ================================================================ evals
# apps/evals: golden cases, each run through the engine command as engine run --json.
[evals]
engine_command = ["uv", "run", "--no-sync", "engine"]
timeout_secs = 900.0
cases_dir = "apps/evals/cases"
baseline_path = "apps/evals/baseline.json"
report_path = ".bijou/evals/report.json"
tolerance = 0.0
