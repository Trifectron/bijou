name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The training image. Rebuilt only when something it contains changed.
  image:
    name: Training image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - .github/workflows/cd.yml
              - deploy/Dockerfile
              - pyproject.toml
              - bijou/**
              - third_party/**
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/setup-buildx-action@v3
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/training
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training
