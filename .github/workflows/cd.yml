name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The training image. Rebuilt only when something it contains changed.
  image:
    name: Training image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            image:
              - .github/workflows/cd.yml
              - deploy/Dockerfile
              - pyproject.toml
              - uv.lock
              - bijou.toml
              - bijou/**
              - third_party/**
      # The CUDA torch layers outgrow the runner's free disk. These toolchains are unused here.
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/setup-buildx-action@v4.3.0
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/training
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - if: steps.filter.outputs.image == 'true' || github.event_name != 'push'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            TORCH=cuda
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training
