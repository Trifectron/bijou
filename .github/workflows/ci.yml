name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: just setup
      # The same recipe a developer and the pre-commit hook run. No GPU here, so
      # the model stack is absent and gpu-marked tests are skipped.
      - run: just check
