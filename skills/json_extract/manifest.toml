targets         = ["attn.qkv", "attn.proj", "mlp.w1", "mlp.w2", "mlp.w3"]
dataset         = "gen:json_extract"     # scripts/gen_json_extract.py
eval            = "eval:json_extract"    # exact schema match, parse rate

